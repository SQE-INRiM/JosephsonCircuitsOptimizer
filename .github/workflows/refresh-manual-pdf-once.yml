name: One-time sync tracked JCO manual PDF from release
on:
  push:
    branches:
      - fix/manual-pdf-logo
    paths:
      - '.github/workflows/refresh-manual-pdf-once.yml'

permissions:
  contents: write

jobs:
  sync-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download official compiled v0.5.0 manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" \
            --pattern "JCO_Documentation.pdf" --dir docs --clobber
          echo 'd126666fa4b1bfec0956e55faf39321f96c50dbf6161bba95482b3d0d625a3cd  docs/JCO_Documentation.pdf' | sha256sum -c -
      - name: Commit exact release PDF to the repository branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JCO_Documentation.pdf
          if git diff --cached --quiet; then
            echo "Repository PDF already matches the released manual."
          else
            git commit -m "docs: synchronize tracked PDF with official v0.5.0 manual"
            git push origin HEAD:fix/manual-pdf-logo
          fi
