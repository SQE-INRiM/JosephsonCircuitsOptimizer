name: One-time refresh of tracked JCO manual PDF
on:
  push:
    branches:
      - fix/manual-pdf-logo
    paths:
      - '.github/workflows/refresh-manual-pdf-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX and SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern librsvg2-bin poppler-utils
      - name: Rebuild manual from canonical LaTeX source
        run: |
          bash docs/build_manual.sh
          pdfinfo docs/JCO_Documentation.pdf | grep '^Pages:'
          test -s docs/.manual-build/jco-logo.pdf
          test -s docs/JCO_Documentation.pdf
      - name: Commit regenerated PDF to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JCO_Documentation.pdf
          if git diff --cached --quiet; then
            echo "PDF already matches the compiled LaTeX source."
          else
            git commit -m "docs: regenerate tracked PDF with official JCO logo"
            git push origin HEAD:fix/manual-pdf-logo
          fi
