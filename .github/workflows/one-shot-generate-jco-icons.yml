name: One-shot JCO icon generation

on:
  push:
    branches:
      - feat/jco-branding-logo-app-icon
    paths:
      - .github/workflows/one-shot-generate-jco-icons.yml

permissions:
  contents: write

jobs:
  create-native-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jco-branding-logo-app-icon
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon generation tools
        run: python -m pip install "Pillow==11.3.0" "CairoSVG==2.8.2"
      - name: Generate multi-resolution icons from approved SVG
        run: python gui/scripts/generate-app-icons.py
      - name: Commit generated native assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/build/icon.ico gui/build/icon.png
          git commit -m "assets(gui): add generated Windows ICO and Linux PNG"
          git push origin HEAD:feat/jco-branding-logo-app-icon
