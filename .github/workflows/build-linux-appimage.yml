name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'gui/src/**'
      - 'gui/desktop/**'
      - 'gui/runtime/bridge/**'
      - 'gui/runtime/templates/**'
      - 'gui/runtime/examples/**'
      - 'gui/scripts/prepare-packaged-jco.cjs'
      - 'gui/package.json'
      - 'gui/package-lock.json'
      - 'gui/vite.config.ts'
      - 'gui/tsconfig*.json'
      - 'gui/electron-builder.yml'
      - '.github/workflows/build-linux-appimage.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: gui

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux AppImage
        run: npm run package:linux

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: JCO-GUI-Linux-x64-AppImage
          path: gui/dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 14
